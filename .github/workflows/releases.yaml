name: Automated release from PR label

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: |
      github.event.pull_request.merged == true && 
      (contains(github.event.pull_request.labels.*.name, 'major') ||
       contains(github.event.pull_request.labels.*.name, 'minor') ||
       contains(github.event.pull_request.labels.*.name, 'patch'))
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Extract release notes from PR
        id: extract_notes
        run: |
          cat << 'EOF' > pr_body.txt
          ${{ github.event.pull_request.body }}
          EOF
          sed -n '/## Release notes/,$p' pr_body.txt | tail -n +2 | sed -e '/##/,$d' > extracted_notes.txt
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' extracted_notes.txt
          if [ ! -s extracted_notes.txt ]; then
            echo "No public-facing release notes." > extracted_notes.txt
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat extracted_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate next version #
        id: semver
        run: |
          git fetch --tags || true
          TAG_COUNT=$(git tag | wc -l)
          if [ "$TAG_COUNT" -eq 0 ]; then
            echo "No tags found in repository. Setting baseline to v0.0.0"
            LATEST_TAG="v0.0.0"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          echo "Current latest version tag is: $LATEST_TAG"
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'major') }}" == "true" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'minor') }}" == "true" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'patch') }}" == "true" ]]; then
            PATCH=$((PATCH + 1))
          fi
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "Calculated target version tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create repo release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.semver.outputs.NEW_TAG }}',
              name: 'Release ${{ steps.semver.outputs.NEW_TAG }}',
              body: `${{ steps.extract_notes.outputs.RELEASE_NOTES }}`,
              draft: false,
              prerelease: false
            });
