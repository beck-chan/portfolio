name: Spell check PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cspell:
    name: Run cspell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run spell checker
        id: spellcheck
        run: |
          set +e
          npx --yes cspell "**/*.qmd" --exclude "_output" --exclude ".quarto" > cspell-output.txt
          status=$?
          set -e
          cat cspell-output.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cspell-pr-comment -->';
            const failed = '${{ steps.spellcheck.outputs.exit_code }}' !== '0';
            let output = fs.readFileSync('cspell-output.txt', 'utf8').trim();
            const max = 60000;
            if (output.length > max) {
              output = output.slice(0, max) + '\n\n…truncated';
            }

            const body = failed
              ? `${marker}\n## Spelling errors found\n\n\`\`\`text\n${output}\n\`\`\``
              : `${marker}\n## No spelling errors found`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if spell check failed
        if: steps.spellcheck.outputs.exit_code != '0'
        run: exit 1
