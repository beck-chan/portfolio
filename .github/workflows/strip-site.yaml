name: Render & deploy theme stripped portfolio to Netlify

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  strip:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Render static files
        run: |
          set -o pipefail
          quarto render --profile strip 2>&1 | tee render_errors.log || {
            echo "Quarto render failed immediately";
            cat render_errors.log;
            exit 1;
          }

      - name: Deploy to Netlify
        env:
          NETLIFY_PAT: ${{ secrets.NETLIFY_PAT }}
          FOLIO_PROJECT: ${{ secrets.FOLIO_PROJECT }}
        run: |
          set -euo pipefail
          if [ ! -d _output ]; then
            echo "Quarto output directory _output/ is missing"
            exit 1
          fi
          npx --yes netlify-cli deploy \
            --prod \
            --dir=_output \
            --message="portfolio-pr-${{ github.event.number }}" \
            --auth="$NETLIFY_PAT" \
            --site="$FOLIO_PROJECT"
