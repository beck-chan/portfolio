<script>
  // Quarto's layoutMarginEls only separates margin notes from each other.
  // Seed that same cascade with the TOC/category panel bottom so footnotes
  // start below #quarto-margin-sidebar instead of overlapping it.
  // When notes stack taller than the body, pad main.content so the
  // footer clears the last footnote. Padding the main grid row (not
  // #quarto-content) also stretches the docked sidebar with it.
  (() => {
    const MARGIN_SEL =
      ".column-margin.column-container > *, .margin-caption, .aside";
    const GAP_AFTER_SIDEBAR = "0.5rem";
    const GAP_BEFORE_FOOTER = "1.5rem";
    const READY_CLASS = "margin-below-toc-ready";

    const remPx = (raw) => {
      const root = window.getComputedStyle(document.documentElement);
      const fontSize = parseFloat(root.fontSize) || 16;
      const value = String(raw).trim();
      if (value.endsWith("rem")) return (parseFloat(value) || 0) * fontSize;
      if (value.endsWith("px")) return parseFloat(value) || 0;
      return parseFloat(value) || 0;
    };

    const contentHost = () =>
      document.querySelector("main.content") ||
      document.getElementById("quarto-document-content");

    const sidebarContentBottom = () => {
      const sidebar = document.getElementById("quarto-margin-sidebar");
      if (!sidebar) return 0;

      let bottom = 0;
      for (const child of sidebar.children) {
        if (child.classList.contains("quarto-sidebar-toggle")) continue;
        if (child.id === "portfolio-toc-toggle") continue;
        if (child.id === "portfolio-toc-sentinel") continue;
        if (window.getComputedStyle(child).display === "none") continue;
        const rect = child.getBoundingClientRect();
        if (rect.height === 0) continue;
        bottom = Math.max(bottom, rect.bottom + window.scrollY);
      }
      return bottom > 0 ? bottom + remPx(GAP_AFTER_SIDEBAR) : 0;
    };

    // Expand the main column (grid row), not #quarto-content padding —
    // container padding sits outside the tracks and leaves a gap under
    // the docked sidebar background.
    // Theme sets padding-bottom with !important, so we must too.
    const expandContentForMargins = (lastBottom) => {
      const host = contentHost();
      const legacy = document.getElementById("quarto-content");
      // Clear older pad target if a previous version set it.
      if (legacy && legacy !== host) {
        legacy.style.removeProperty("padding-bottom");
      }
      if (!host) return;

      if (!(lastBottom > 0)) {
        host.style.removeProperty("padding-bottom");
        return;
      }

      const computedPad =
        parseFloat(window.getComputedStyle(host).paddingBottom) || 0;
      const marginBottom =
        parseFloat(window.getComputedStyle(host).marginBottom) || 0;
      // Border-box bottom minus padding = content edge; negative
      // margin-bottom pulls the footer up, so add it back into need.
      const contentEdge =
        host.getBoundingClientRect().bottom + window.scrollY - computedPad;
      const needed = Math.ceil(
        lastBottom + remPx(GAP_BEFORE_FOOTER) - contentEdge - marginBottom
      );
      const themeMin = remPx("2rem");
      if (needed <= themeMin) {
        host.style.removeProperty("padding-bottom");
        return;
      }

      const next = `${needed}px`;
      if (host.style.getPropertyValue("padding-bottom") !== next) {
        host.style.setProperty("padding-bottom", next, "important");
      }
    };

    // Quarto leaves margin footnotes inside tab panes and marks the
    // tabset with page-columns/page-full, nesting a full page grid in
    // the body column. On desktop, move those notes into a sibling
    // .tabset-margin-container so they sit in the page margin and
    // Quarto's shown.bs.tab handler can toggle visibility.
    // On mobile, Quarto inlines .column-margin in document order —
    // keep notes after their host (same as outside tabsets) instead
    // of leaving the hoisted container above the tabset.
    const INLINE_MARGIN_MQ = "(max-width: 767.98px)";
    const marginsAreInline = () =>
      window.matchMedia(INLINE_MARGIN_MQ).matches;

    const escapeAttr = (value) =>
      window.CSS?.escape ? window.CSS.escape(value) : value;

    const findTabsetMarginContainer = (tabset) => {
      for (const sib of [
        tabset.previousElementSibling,
        tabset.nextElementSibling,
      ]) {
        if (sib?.classList.contains("tabset-margin-container")) return sib;
      }
      return null;
    };

    const paneForMarginWrap = (tabset, wrap) => {
      const paneId = wrap.dataset.tabPaneId;
      if (paneId) {
        const byId = document.getElementById(paneId);
        if (byId) return byId;
      }
      for (const cls of wrap.classList) {
        if (cls === "tabset-margin-content") continue;
        const fromPane = cls.match(/^(.+)-tab-margin-content$/);
        if (fromPane) {
          const pane = document.getElementById(fromPane[1]);
          if (pane) return pane;
        }
        const fromTab = cls.match(/^(.+)-margin-content$/);
        if (fromTab) {
          const pane = tabset.querySelector(
            `.tab-pane[aria-labelledby="${escapeAttr(fromTab[1])}"]`
          );
          if (pane) return pane;
        }
      }
      return null;
    };

    const stripNestedPageGrid = (tabset) => {
      const strip = (el) => {
        el.classList.remove("page-columns", "page-full");
      };
      strip(tabset);
      tabset.querySelectorAll(".page-columns, .page-full").forEach(strip);
    };

    const hoistTabsetMargins = (tabset) => {
      const margins = [
        ...tabset.querySelectorAll(".column-margin.column-container"),
      ];
      if (!margins.length) return;

      let container = findTabsetMarginContainer(tabset);
      if (!container) {
        container = document.createElement("div");
        container.className = "tabset-margin-container";
      }
      if (tabset.previousElementSibling !== container) {
        tabset.parentElement?.insertBefore(container, tabset);
      }

      // Sit in the parent section's page grid as the margin column.
      container.classList.add(
        "column-margin",
        "column-container",
        "no-row-height"
      );

      margins.forEach((margin) => {
        const pane = margin.closest(".tab-pane");
        const tabBtnId =
          pane?.getAttribute("aria-labelledby") ||
          (pane?.id ? `${pane.id}-tab` : null);
        const wrap = document.createElement("div");
        wrap.className = "tabset-margin-content";
        if (tabBtnId) wrap.classList.add(`${tabBtnId}-margin-content`);
        if (pane?.id) wrap.dataset.tabPaneId = pane.id;
        const host = margin.previousElementSibling;
        if (host) {
          const hostId =
            host.dataset.marginHost ||
            `mhost-${Math.random().toString(36).slice(2, 10)}`;
          host.dataset.marginHost = hostId;
          wrap.dataset.marginHost = hostId;
        }
        if (!pane?.classList.contains("active")) {
          wrap.classList.add("collapse");
        }
        while (margin.firstChild) wrap.appendChild(margin.firstChild);
        container.appendChild(wrap);
        margin.remove();
      });
    };

    const restoreTabsetMargins = (tabset) => {
      const container = findTabsetMarginContainer(tabset);
      if (!container) return;

      [...container.children].forEach((child) => {
        const pane = paneForMarginWrap(tabset, child);
        if (!pane) return;

        child.classList.remove("collapse");
        const hostId = child.dataset.marginHost;
        const host =
          hostId && pane.querySelector(`[data-margin-host="${escapeAttr(hostId)}"]`);

        if (child.classList.contains("column-margin")) {
          // Quarto already hoisted the whole .column-margin node.
          if (host) host.insertAdjacentElement("afterend", child);
          else pane.appendChild(child);
          return;
        }

        const margin = document.createElement("div");
        margin.className = "column-margin column-container no-row-height";
        while (child.firstChild) margin.appendChild(child.firstChild);
        for (const note of margin.children) {
          note.style.marginTop = null;
        }
        if (host) host.insertAdjacentElement("afterend", margin);
        else pane.appendChild(margin);
        child.remove();
      });

      if (!container.children.length) container.remove();
    };

    const syncTabsetMargins = () => {
      const inline = marginsAreInline();
      document.querySelectorAll(".panel-tabset").forEach((tabset) => {
        stripNestedPageGrid(tabset);
        if (inline) restoreTabsetMargins(tabset);
        else hoistTabsetMargins(tabset);
      });
    };

    const layoutMarginBelowToc = () => {
      syncTabsetMargins();

      const marginChildren = document.querySelectorAll(MARGIN_SEL);
      if (!marginChildren.length) {
        expandContentForMargins(0);
        return;
      }

      let lastBottom = sidebarContentBottom();
      for (const el of marginChildren) {
        if (el.offsetParent === null) continue;

        el.style.marginTop = null;
        const top = el.getBoundingClientRect().top + window.scrollY;
        if (lastBottom > 0 && top < lastBottom) {
          const marginBottom =
            parseFloat(window.getComputedStyle(el).marginBottom) || 0;
          el.style.marginTop = `${lastBottom - top + marginBottom}px`;
        }

        const marginTop =
          parseFloat(window.getComputedStyle(el).marginTop) || 0;
        const height = el.getBoundingClientRect().height;
        lastBottom = top + height + marginTop;
      }

      expandContentForMargins(lastBottom);
    };

    const reveal = () => {
      document.documentElement.classList.add(READY_CLASS);
    };

    const layoutAndReveal = () => {
      layoutMarginBelowToc();
      reveal();
    };

    // Run after Quarto's own throttled layoutMarginEls (50ms).
    const schedule = () => {
      clearTimeout(schedule._timer);
      schedule._timer = setTimeout(layoutAndReveal, 60);
    };

    window.document.addEventListener("DOMContentLoaded", () => {
      schedule();
      // Failsafe: never leave footnotes hidden if layout is delayed.
      setTimeout(reveal, 1500);
      const inlineMq = window.matchMedia(INLINE_MARGIN_MQ);
      if (inlineMq.addEventListener) {
        inlineMq.addEventListener("change", schedule);
      } else if (inlineMq.addListener) {
        inlineMq.addListener(schedule);
      }
      // Re-cascade when Quarto toggles tabset margin note visibility.
      window.document.querySelectorAll('.panel-tabset a[data-bs-toggle="tab"]').forEach((tab) => {
        tab.addEventListener("shown.bs.tab", schedule);
      });
      window.document.querySelectorAll(".column-margin img").forEach((img) => {
        if (!img.complete) img.addEventListener("load", schedule, { once: true });
      });
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(schedule);
        ro.observe(window.document.body);
        const sidebar = window.document.getElementById("quarto-margin-sidebar");
        if (sidebar) ro.observe(sidebar);
        const margin = window.document.querySelector(
          ".column-margin.column-container"
        );
        if (margin) ro.observe(margin);
      }
    });
  })();
</script>
