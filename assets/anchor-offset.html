<script>
  // Keep in-page hash targets below the fixed header. Quarto's hashchange
  // offset looks for header.fixed-top and can fire before native scroll, and
  // CSS scroll-margin is unreliable on page-columns grid sections.
  // Desktop is the navbar only; mobile stacks navbar + quarto-secondary-nav.
  // Margin footnotes also clear the accordion TOC / category filters.
  (() => {
    const GAP = 8;
    const NAVBAR_FALLBACK = 80;

    const visibleFixedBottom = (el) => {
      if (!el) return 0;
      const style = window.getComputedStyle(el);
      if (style.display === "none" || style.visibility === "hidden") return 0;
      if (style.position !== "fixed" && style.position !== "sticky") return 0;
      const rect = el.getBoundingClientRect();
      return rect.height > 0 && rect.bottom > 0 ? rect.bottom : 0;
    };

    const headerOffset = () => {
      const navbar =
        document.querySelector("#quarto-header nav.navbar") ||
        document.querySelector("#quarto-header") ||
        document.querySelector("nav.navbar");
      const secondary = document.querySelector("nav.quarto-secondary-nav");
      const bottom = Math.max(
        visibleFixedBottom(navbar),
        visibleFixedBottom(secondary)
      );
      if (bottom > 0) return Math.ceil(bottom) + GAP;
      // Empty #quarto-header still exists on navbar:false pages.
      const navbarHeight = navbar ? navbar.getBoundingClientRect().height : 0;
      return navbarHeight > 0 ? NAVBAR_FALLBACK : 0;
    };

    // Desktop margin notes share a column with the accordion TOC and
    // listing category filters. Measure whatever of that chrome is
    // still on screen (fixed accordion after scroll, in-flow panel
    // near the top).
    const visibleBoxBottom = (el) => {
      if (!el || el.hidden) return 0;
      const style = window.getComputedStyle(el);
      if (style.display === "none" || style.visibility === "hidden") return 0;
      const rect = el.getBoundingClientRect();
      if (rect.height <= 0) return 0;
      if (rect.bottom <= 0 || rect.top >= window.innerHeight) return 0;
      return rect.bottom;
    };

    const marginChromeBottom = () => {
      const selectors = [
        "#portfolio-toc-toggle",
        "#quarto-margin-sidebar nav#TOC",
        "#quarto-margin-sidebar nav[role='doc-toc']",
        "#quarto-margin-sidebar .quarto-listing-category-title",
        "#quarto-margin-sidebar .quarto-listing-category",
      ];
      let bottom = 0;
      for (const selector of selectors) {
        bottom = Math.max(bottom, visibleBoxBottom(document.querySelector(selector)));
      }
      return bottom;
    };

    const isMarginTarget = (el) => {
      if (!el) return false;
      if (el.id && /^fn\d/.test(el.id)) return true;
      return Boolean(
        el.closest(
          ".column-margin, .aside, .tabset-margin-container, #quarto-margin-sidebar"
        )
      );
    };

    const targetOffset = (el) => {
      const header = headerOffset();
      if (!isMarginTarget(el)) return header;
      const margin = marginChromeBottom();
      if (margin > 0) return Math.max(header, Math.ceil(margin) + GAP);
      return header;
    };

    const syncScrollPadding = () => {
      const offset = headerOffset();
      if (offset > 0) {
        document.documentElement.style.scrollPaddingTop = `${offset}px`;
      } else {
        document.documentElement.style.removeProperty("scroll-padding-top");
      }
    };

    const targetEl = (hash) => {
      if (!hash) return null;
      const id = decodeURIComponent(String(hash).replace(/^#/, ""));
      if (!id) return null;
      return (
        document.getElementById(id) ||
        document.querySelector(`[data-anchor-id="${CSS.escape(id)}"]`)
      );
    };

    const scrollToEl = (el) => {
      if (!el) return;
      const offset = targetOffset(el);
      if (offset <= 0) return;
      const top = el.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
    };

    const samePageHash = (link) => {
      try {
        const url = new URL(link.href, window.location.href);
        if (url.pathname !== window.location.pathname) return null;
        if (url.search !== window.location.search) return null;
        return url.hash || null;
      } catch {
        return null;
      }
    };

    document.addEventListener("click", (event) => {
      const link = event.target.closest("a[href]");
      if (!link) return;
      if (link.dataset.bsToggle) return;
      const hash = samePageHash(link);
      if (!hash) return;
      const el = targetEl(hash);
      if (!el) return;
      // After native scroll + Quarto's hashchange handler.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => scrollToEl(el));
      });
    });

    const applyHash = () => scrollToEl(targetEl(window.location.hash));

    window.addEventListener("hashchange", () => {
      requestAnimationFrame(() => {
        requestAnimationFrame(applyHash);
      });
    });

    const onReady = () => {
      syncScrollPadding();
      if (!window.location.hash) return;
      applyHash();
      setTimeout(applyHash, 250);
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", onReady);
    } else {
      onReady();
    }
    window.addEventListener("load", onReady);
    window.addEventListener("resize", syncScrollPadding);
  })();
</script>
