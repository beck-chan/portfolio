project:
  type: website
  output-dir: _output
  render:
    - "**/*.qmd"
    - "**/*.ipynb"

profile:
  default: custom

language:
  toggle-dark-mode: "Toggle Theme"
  toc-title-website: "Table of Contents"
  listing-page-no-matches: "No Matches Found"
  search-no-results-text: "No Results Found"
  search-text-placeholder: "Search Portfolio"

metadata-files:
  - samples/content-engineering/_sidebar.yaml
  - samples/technical-writing/_sidebar.yaml
  - samples/copywriting/_sidebar.yaml
  # - samples/developer-advocacy/_sidebar.yaml
  - samples/organizations/_sidebar.yaml

website:
  title: "Portfolio"
  favicon: assets/headshot.png
  page-navigation: true
  navbar:
    left:
      - samples/content-engineering/index.qmd
      - samples/technical-writing/index.qmd
      - samples/copywriting/index.qmd
      # - samples/developer-advocacy/index.qmd
    right:
      - cv.qmd
      - text: '[{{< fa brands github >}}]{title="GitHub / beck-chan"}'
        target: _blank
        href: https://github.com/beck-chan
        aria-label: GitHub
      - text: '[{{< fa brands linkedin >}}]{title="LinkedIn / beck-chan"}'
        target: _blank
        href: https://linkedin.com/in/beck-chan
        aria-label: LinkedIn
      - text: '[{{< fa envelope >}}]{title="Email / beckchan.tech@gmail.com"}'
        href: mailto:beckchan.tech@gmail.com
        target: _blank
        aria-label: Email
      - text: '[{{< fa feather >}}]{title="Poetry"}'
        href: poetry/index.qmd
        aria-label: Poetry

  sidebar: 
    style: docked
    border: false

  search:
    location: navbar

  page-footer:
    left:
      - text: "Releases"
        href: https://github.com/beck-chan/portfolio/releases
        target: _blank
    center:
      - text: "{{< fa brands github >}} Report Issue"
        href: https://github.com/beck-chan/portfolio/issues
        target: _blank
    right:
      - text: "&#169; 2026 <b>Beck Chan</b>. All rights reserved."

format:
  html:
    page-layout: full
    grid:
      body-width: 1000px
      sidebar-width: 400px
      margin-width: 500px
    theme:
      light: assets/themes/default/styles.scss
      dark: assets/themes/minimal/styles.scss
    syntax-highlighting:
      light: assets/themes/default/code.theme
      dark: assets/themes/minimal/code.theme
    code-overflow: wrap
    toc: true
    toc-depth: 5
    link-external-newwindow: true
    reference-location: margin
    footnotes-hover: true
    lightbox: true

filters:
  - timeline
  - tachyons
  - fold-code
